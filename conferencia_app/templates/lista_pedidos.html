<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos da Carga - {{ nome_da_carga }}</title>
    <!-- Link para o CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos customizados para o design escuro -->
    <style>
        :root {
            --cor-fundo-escuro: #121212;
            --cor-superficie-escura: #1e1e1e;
            --cor-primaria-azul: #3d8bfd;
            --cor-hover-suave: rgba(61, 139, 253, 0.1);
            --cor-texto-principal: #e4e6eb;
            --cor-texto-secundario: #b0b3b8;
            --cor-borda-escura: #333;
            --cor-verde-sucesso: #1c3b2a; /* Fundo verde escuro para itens finalizados */
            --cor-borda-sucesso: #2a5c42;
        }

        body {
            background-color: var(--cor-fundo-escuro);
            color: var(--cor-texto-principal);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar-custom {
            background-color: var(--cor-superficie-escura);
            border-bottom: 1px solid var(--cor-borda-escura);
        }

        .navbar-brand, .nav-link {
            color: var(--cor-texto-secundario);
            font-weight: 500;
        }
        
        .nav-link.active {
            color: white;
            font-weight: 700;
        }

        .nav-link:hover {
            color: white;
        }

        .main-container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 15px;
        }

        .main-title {
            color: white;
            font-weight: 700;
        }
        
        .main-title .carga-name {
            color: var(--cor-primaria-azul);
        }

        .btn-outline-secondary {
            color: var(--cor-texto-secundario);
            border-color: var(--cor-texto-secundario);
        }

        .btn-outline-secondary:hover {
            color: white;
            background-color: var(--cor-texto-secundario);
            border-color: var(--cor-texto-secundario);
        }

        .list-group-item {
            background-color: var(--cor-superficie-escura);
            border: 1px solid var(--cor-borda-escura);
            color: var(--cor-texto-principal);
            margin-bottom: 0.75rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease-in-out;
        }

        .list-group-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border-color: var(--cor-primaria-azul);
        }
        
        /* NOVO ESTILO PARA A BARRA FINALIZADA */
        .item-finalizado {
            background-color: var(--cor-verde-sucesso);
            border-color: var(--cor-borda-sucesso);
        }
        .item-finalizado:hover {
            border-color: #3dd58c;
        }
        .item-finalizado .cliente-nome, .item-finalizado .arquivo-nome {
            color: #a6c3b8;
        }

        .pedido-numero {
            font-weight: 600;
        }

        .cliente-nome {
            color: var(--cor-texto-secundario);
            font-size: 0.9rem;
        }
        
        .arquivo-nome {
             color: var(--cor-texto-secundario);
             font-size: 0.8rem;
             font-style: italic;
        }

        .badge.bg-success {
            background-color: #198754 !important;
        }

        .badge.bg-warning {
            background-color: #ffc107 !important;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">App Conferência</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/conferencia">Conferência</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/gestao">Gestão</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-container">
    <a href="/conferencia" class="btn btn-outline-secondary mb-4">&larr; Voltar para Seleção de Cargas</a>
    <h1 class="main-title mb-4">Pedidos da Carga: <span class="carga-name">{{ nome_da_carga }}</span></h1>
    <div class="mb-4 d-flex align-items-center gap-2">
        <span id="conferenteAtual" class="text-light"></span>

        <button type="button" class="btn btn-sm btn-outline-primary" id="btnTrocarConferente">
            Trocar
        </button>
    </div>

    <div id="pedidos-container" class="list-group">
        <p class="text-center text-muted">A carregar pedidos...</p>
    </div>
</div>

<!-- Modal de seleção do conferente -->
<div class="modal fade" id="modalConferente" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light">

            <div class="modal-header">
                <h5 class="modal-title">Quem irá conferir este pedido?</h5>
            </div>

            <div class="modal-body">

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="conferente" id="moacir" value="Moacir">
                    <label class="form-check-label" for="moacir">Moacir</label>
                </div>

                <div class="form-check mt-2">
                    <input class="form-check-input" type="radio" name="conferente" id="vitor" value="Vitor">
                    <label class="form-check-label" for="vitor">Vitor</label>
                </div>

                <div class="form-check mt-2">
                    <input class="form-check-input" type="radio" name="conferente" id="yves" value="Yves">
                    <label class="form-check-label" for="yves">Yves</label>
                </div>

                <div class="form-check mt-2">
                    <input class="form-check-input" type="radio" name="conferente" id="luan" value="Luan">
                    <label class="form-check-label" for="luan">Luan</label>
                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-primary" id="btnConfirmarConferente">
                    Iniciar Conferência
                </button>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    let pedidoPendente = null;
    const modalConferente = new bootstrap.Modal(document.getElementById('modalConferente'));
    const nomeDaCarga = "{{ nome_da_carga }}";
    const container = document.getElementById('pedidos-container');
    const conferenteAtual = document.getElementById('conferenteAtual');
    const btnTrocarConferente = document.getElementById('btnTrocarConferente');

    function atualizarConferenteNaTela() {
        const conferente = localStorage.getItem('conferente');

        if (conferente) {
            conferenteAtual.textContent = `👤 Conferente: ${conferente}`;
        } else {
            conferenteAtual.textContent = '👤 Conferente: não selecionado';
        }
    }

    atualizarConferenteNaTela();
    
    // 1. Chave única para o localStorage baseada no nome da carga
    const localStorageKey = `ultimoPedidoClicado_${nomeDaCarga}`;

    fetch(`/api/pedidos/${nomeDaCarga}`)
        .then(response => response.json())
        .then(pedidos => {
            container.innerHTML = '';

            if (pedidos.length === 0) {
                container.innerHTML = '<div class="alert alert-secondary text-center">Nenhum pedido encontrado para esta carga.</div>';
                return;
            }

            pedidos.forEach(pedido => {
                let statusClasse = '';
                let itemClasse = '';
                let statusTexto = pedido.status_conferencia || 'Pendente';

                if (
                    pedido.status_conferencia !== 'Finalizado' &&
                    pedido.conferente_em_andamento
                ) {
                    statusTexto = 'Em conferência';
                    statusClasse = 'bg-warning text-dark';
                }

                                switch (statusTexto) {
                    case 'Finalizado':
                        statusClasse = 'bg-success';
                        itemClasse = 'item-finalizado';
                        break;

                    case 'Em conferência':
                        statusClasse = 'bg-warning text-dark';
                        break;

                    case 'Pendente':
                        statusClasse = 'bg-warning text-dark';
                        break;

                    default:
                        statusClasse = 'bg-secondary';
                }
                
                // NOVIDADE: Adicionamos o atributo 'data-pedido-id' para identificar o link
                const pedidoHtml = `
                    <a href="/pedido/${pedido.numero_pedido}" 
                       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center ${itemClasse}"
                       data-pedido-id="${pedido.numero_pedido}">
                        <div>
                            <div class="pedido-numero">Pedido: ${pedido.numero_pedido}</div>
                            <div class="cliente-nome">${pedido.nome_cliente}</div>
                            <div class="arquivo-nome">Arquivo: ${pedido.nome_arquivo}</div>
                        </div>
                        <div class="text-end">
                            <span class="badge ${statusClasse} rounded-pill">${statusTexto}</span>

                            ${(pedido.conferente_em_andamento || pedido.conferente) ? `
                                <div class="mt-2 small text-info fw-semibold">
                                    👤 ${pedido.conferente_em_andamento || pedido.conferente}
                                </div>
                            ` : ''}
                        </div>
                    </a>
                `;
                container.innerHTML += pedidoHtml;
            });

            // 2. Lógica para restaurar a posição do scroll
            const ultimoPedidoId = localStorage.getItem(localStorageKey);
            if (ultimoPedidoId) {
                const ultimoPedidoElemento = container.querySelector(`[data-pedido-id="${ultimoPedidoId}"]`);
                if (ultimoPedidoElemento) {
                    // Rola a tela até o elemento, posicionando-o no centro
                    ultimoPedidoElemento.scrollIntoView({
                        behavior: 'auto', // 'auto' para um pulo instantâneo
                        block: 'center'
                    });
                }
            }

            // 3. Lógica para identificar o conferente antes de abrir o pedido
	    container.addEventListener('click', function(event) {

    		const linkDoPedido = event.target.closest('a.list-group-item');

    		if (!linkDoPedido) return;

    		event.preventDefault();

    		const pedidoId = linkDoPedido.dataset.pedidoId;

    		// Mantém a lógica existente de lembrar o último pedido clicado
    		localStorage.setItem(localStorageKey, pedidoId);

    		            // Verifica se já existe um conferente selecionado
            const conferente = localStorage.getItem('conferente');

            if (conferente) {

                               fetch('/api/pedido/iniciar-conferencia', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        pedido_id: pedidoId,
                        conferente: conferente
                    })
                })
                .then(response => response.json())
                .then(resultado => {

                    if (resultado.sucesso) {
                        window.location.href = linkDoPedido.href;
                    } else {

                        const desejaEntrar = confirm(
                            `${resultado.erro}\n\nDeseja entrar mesmo assim?`
                        );

                        if (desejaEntrar) {
                            window.location.href = linkDoPedido.href;
                        }

                    }

                });

                return;
            }

    		// Se não houver conferente, guarda o pedido que a pessoa tentou abrir
    		pedidoPendente = linkDoPedido.href;

    		// Abre o modal para selecionar o nome
    		modalConferente.show();
	    });
        })
        .catch(error => {
            console.error('Erro:', error);
            container.innerHTML = '<div class="alert alert-danger">Falha ao carregar os pedidos.</div>';
        });
// Confirma o conferente escolhido
document.getElementById('btnConfirmarConferente').addEventListener('click', function () {

    const selecionado = document.querySelector('input[name="conferente"]:checked');

    if (!selecionado) {
        alert("Selecione seu nome.");
        return;
    }

    // Salva o conferente
    localStorage.setItem('conferente', selecionado.value);
    atualizarConferenteNaTela();

    // Fecha o modal
    modalConferente.hide();

    // Abre o pedido que estava pendente    // Se o modal abriu porque o usuário clicou em um pedido,
    // abre o pedido normalmente.
    // Se abriu pelo botão "Trocar", apenas permanece na carga atual.
    if (pedidoPendente) {
        window.location.href = pedidoPendente;
    } else {
        modalConferente.hide();
    }

});
    btnTrocarConferente.addEventListener('click', function () {

        localStorage.removeItem('conferente');

        document.querySelectorAll('input[name="conferente"]').forEach(input => {
            input.checked = false;
        });

        atualizarConferenteNaTela();

        modalConferente.show();

    });
});
</script>

</body>
</html>
